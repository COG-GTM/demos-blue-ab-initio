#=============================================================================
# Configuration: abinitio.cfg (PROD)
# JIRA: GMRD-211
# Author: GMRD Data Engineering
# Description: Ab Initio Co>Operating System configuration for PROD environment.
#=============================================================================

[general]
project_name = GMRD
environment = PROD
sandbox = /data/gmrd/prod
log_level = WARN
temp_dir = /data/gmrd/prod/tmp
serial_dir = /data/gmrd/prod/serial

[runtime]
max_parallelism = 8
max_memory_mb = 16384
max_temp_space_gb = 500
checkpoint_enabled = true
checkpoint_dir = /data/gmrd/prod/checkpoint
record_count_logging = true

[database]
teradata_host = TDPRD01
teradata_port = 1025
teradata_database = GMRD_CORE_DB
teradata_charset = UTF8
teradata_tmode = ANSI
teradata_max_sessions = 16

[feeds]
bloomberg_dir = /data/feeds/bloomberg/prod
reuters_dir = /data/feeds/reuters/prod
calypso_extract_dir = /data/feeds/calypso/prod
murex_extract_dir = /data/feeds/murex/prod
summit_extract_dir = /data/feeds/summit/prod

[monitoring]
alert_email = gmrd-prod-alerts@group.internal
escalation_email = gmrd-oncall@group.internal
sla_trade_extract_mins = 45
sla_position_extract_mins = 60
sla_transform_mins = 30
sla_load_mins = 45
sla_total_batch_mins = 180

[archiving]
archive_dir = /data/gmrd/prod/data/archive
archive_retention_days = 90
compress_archives = true
