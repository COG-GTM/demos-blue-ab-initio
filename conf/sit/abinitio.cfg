#=============================================================================
# Configuration: abinitio.cfg (SIT)
# JIRA: GMRD-211
# Author: GMRD Data Engineering
# Description: Ab Initio Co>Operating System configuration for SIT environment.
#=============================================================================

[general]
project_name = GMRD
environment = SIT
sandbox = /data/gmrd/sit
log_level = INFO
temp_dir = /data/gmrd/sit/tmp
serial_dir = /data/gmrd/sit/serial

[runtime]
max_parallelism = 4
max_memory_mb = 8192
max_temp_space_gb = 100
checkpoint_enabled = true
checkpoint_dir = /data/gmrd/sit/checkpoint
record_count_logging = true

[database]
teradata_host = TDSIT01
teradata_port = 1025
teradata_database = GMRD_CORE_DB
teradata_charset = UTF8
teradata_tmode = ANSI
teradata_max_sessions = 8

[feeds]
bloomberg_dir = /data/feeds/bloomberg/sit
reuters_dir = /data/feeds/reuters/sit
calypso_extract_dir = /data/feeds/calypso/sit
murex_extract_dir = /data/feeds/murex/sit
summit_extract_dir = /data/feeds/summit/sit

[monitoring]
alert_email = gmrd-sit-alerts@group.internal
sla_trade_extract_mins = 60
sla_position_extract_mins = 60
sla_transform_mins = 45
sla_load_mins = 45
sla_total_batch_mins = 240

[archiving]
archive_dir = /data/gmrd/sit/data/archive
archive_retention_days = 30
compress_archives = true
