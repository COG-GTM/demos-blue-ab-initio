#=============================================================================
# Configuration: abinitio.cfg (UAT)
# JIRA: GMRD-211
# Author: GMRD Data Engineering
# Description: Ab Initio Co>Operating System configuration for UAT environment.
#=============================================================================

[general]
project_name = GMRD
environment = UAT
sandbox = /data/gmrd/uat
log_level = INFO
temp_dir = /data/gmrd/uat/tmp
serial_dir = /data/gmrd/uat/serial

[runtime]
max_parallelism = 4
max_memory_mb = 12288
max_temp_space_gb = 200
checkpoint_enabled = true
checkpoint_dir = /data/gmrd/uat/checkpoint
record_count_logging = true

[database]
teradata_host = TDUAT01
teradata_port = 1025
teradata_database = GMRD_CORE_DB
teradata_charset = UTF8
teradata_tmode = ANSI
teradata_max_sessions = 12

[feeds]
bloomberg_dir = /data/feeds/bloomberg/uat
reuters_dir = /data/feeds/reuters/uat
calypso_extract_dir = /data/feeds/calypso/uat
murex_extract_dir = /data/feeds/murex/uat
summit_extract_dir = /data/feeds/summit/uat

[monitoring]
alert_email = gmrd-uat-alerts@group.internal
escalation_email = gmrd-dataeng@group.internal
sla_trade_extract_mins = 45
sla_position_extract_mins = 60
sla_transform_mins = 30
sla_load_mins = 45
sla_total_batch_mins = 210

[archiving]
archive_dir = /data/gmrd/uat/data/archive
archive_retention_days = 60
compress_archives = true
