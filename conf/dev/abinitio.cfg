#=============================================================================
# Configuration: abinitio.cfg (DEV)
# JIRA: GMRD-211
# Author: GMRD Data Engineering
# Description: Ab Initio Co>Operating System configuration for DEV environment.
#=============================================================================

[general]
project_name = GMRD
environment = DEV
sandbox = /data/gmrd/dev
log_level = DEBUG
temp_dir = /data/gmrd/dev/tmp
serial_dir = /data/gmrd/dev/serial

[runtime]
max_parallelism = 2
max_memory_mb = 4096
max_temp_space_gb = 50
checkpoint_enabled = true
checkpoint_dir = /data/gmrd/dev/checkpoint
record_count_logging = true

[database]
teradata_host = TDDEV01
teradata_port = 1025
teradata_database = GMRD_CORE_DB
teradata_charset = UTF8
teradata_tmode = ANSI
teradata_max_sessions = 4

[feeds]
bloomberg_dir = /data/feeds/bloomberg/dev
reuters_dir = /data/feeds/reuters/dev
calypso_extract_dir = /data/feeds/calypso/dev
murex_extract_dir = /data/feeds/murex/dev
summit_extract_dir = /data/feeds/summit/dev

[monitoring]
alert_email = gmrd-dev-alerts@group.internal
sla_trade_extract_mins = 60
sla_position_extract_mins = 60
sla_transform_mins = 60
sla_load_mins = 60
sla_total_batch_mins = 300

[archiving]
archive_dir = /data/gmrd/dev/data/archive
archive_retention_days = 7
compress_archives = true
